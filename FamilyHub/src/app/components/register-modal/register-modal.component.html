<div class="register-modal mat-elevation-z4">
  <div class="register-header">
    <h2>Create Account</h2>
    <button
      mat-icon-button
      class="close-button"
      (click)="closeModal()"
      [disabled]="isLoading"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="register-content">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full Name</mat-label>
        <input
          matInput
          formControlName="name"
          placeholder="Your full name"
          type="text"
          autocomplete="name"
          [disabled]="isLoading"
        />
        <mat-error *ngIf="registerForm.get('name')?.hasError('required')"
          >Name is required</mat-error
        >
        <mat-error *ngIf="registerForm.get('name')?.hasError('minlength')"
          >Name must be at least 2 characters</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          formControlName="email"
          placeholder="your.email@example.com"
          type="email"
          autocomplete="email"
          [disabled]="isLoading"
        />
        <mat-error *ngIf="registerForm.get('email')?.hasError('required')"
          >Email is required</mat-error
        >
        <mat-error *ngIf="registerForm.get('email')?.hasError('email')"
          >Please enter a valid email</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input
          matInput
          formControlName="password"
          [type]="hide ? 'password' : 'text'"
          autocomplete="new-password"
          [disabled]="isLoading"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hide = !hide"
          [disabled]="isLoading"
        >
          <mat-icon>{{ hide ? "visibility_off" : "visibility" }}</mat-icon>
        </button>
        <mat-error *ngIf="registerForm.get('password')?.hasError('required')"
          >Password is required</mat-error
        >
        <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')"
          >Password must be at least 6 characters</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Confirm Password</mat-label>
        <input
          matInput
          formControlName="confirmPassword"
          [type]="hideConfirm ? 'password' : 'text'"
          autocomplete="new-password"
          [disabled]="isLoading"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hideConfirm = !hideConfirm"
          [disabled]="isLoading"
        >
          <mat-icon>{{
            hideConfirm ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
        <mat-error
          *ngIf="registerForm.get('confirmPassword')?.hasError('required')"
          >Please confirm your password</mat-error
        >
        <mat-error *ngIf="registerForm.hasError('passwordMismatch')"
          >Passwords do not match</mat-error
        >
      </mat-form-field>

      <div class="action-buttons">
        <button
          mat-button
          type="button"
          (click)="showLoginModal()"
          [disabled]="isLoading"
        >
          Already have an account? Sign In
        </button>
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="!registerForm.valid || isLoading"
        >
          <mat-spinner
            *ngIf="isLoading"
            diameter="20"
            class="spinner-button"
          ></mat-spinner>
          <span *ngIf="!isLoading">Create Account</span>
        </button>
      </div>
    </form>
  </div>
</div>
